<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090a09">

  <meta name="description"
        content="Something new is coming. Stay tuned for the next experience from VEYRO.">

  <title>VEYRO — Something New Is Coming</title>

  <link rel="stylesheet" href="style.css">

<body>

  <main class="coming-soon">

    <!-- BRAND -->

      <div class="status">

    <!-- MAIN CONTENT -->

      <div class="background-art" aria-hidden="true">
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="grid-pattern"></div>
      </div>

      <div class="hero-content">

        <p class="eyebrow">

        <h1>

        <div class="launch-status">
          <span class="status-dot"></span>

      <div class="hero-index" aria-hidden="true">
        001 <span>— VEYRO</span>

      <div class="footer-left">
        <span class="footer-brand">VEYRO<span>.</span></span>
        <span class="footer-caption">BUILT WITH PURPOSE.</span>
      </div>

      <a

        href="https://www.instagram.com/al.anzooooo/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit VEYRO creator on Instagram"

        <span class="instagram-icon" aria-hidden="true">◎</span>
        <span>FOLLOW THE JOURNEY</span>
