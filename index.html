<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>VEYRO — Guess the Next</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <a class="logo" href="#">VEYRO<span>.</span></a>
      <button id="soundBtn" class="icon-btn" aria-label="Toggle sound">🔊</button>
    </header>

    <section class="stats">
      <div><small>BEST</small><strong id="best">0</strong></div>
      <div><small>SCORE</small><strong id="score">0</strong></div>
      <div><small>STREAK</small><strong id="streak">0</strong></div>
    </section>

    <section class="play-area">
      <p class="eyebrow">THE NUMBER CHALLENGE</p>
      <h1>GUESS THE <span>NEXT.</span></h1>
      <p class="subtitle">Will the next number be higher or lower?</p>

      <div class="lives" id="lives" aria-label="5 lives">🌙 🌙 🌙 🌙 🌙</div>

      <div class="number-card">
        <span class="number-label">CURRENT NUMBER</span>
        <div id="number" class="number">50</div>
        <div id="feedback" class="feedback" aria-live="polite">
          MAKE YOUR MOVE
        </div>
      </div>

      <div class="buttons">
        <button id="lowerBtn" class="guess-btn lower">
          <span class="arrow">↓</span>
          <span>LOWER</span>
        </button>
        <button id="higherBtn" class="guess-btn higher">
          <span class="arrow">↑</span>
          <span>HIGHER</span>
        </button>
      </div>

      <p class="hint">Choose wisely. One wrong guess costs a moon.</p>
    </section>

    <footer>TRUST YOUR INSTINCTS <span>✦</span></footer>

    <div id="overlay" class="overlay hidden">
      <div class="modal">
        <p class="eyebrow">GAME OVER</p>
        <h2>RUN <span>ENDED.</span></h2>
        <p>Your final score</p>
        <div id="finalScore" class="final-score">0</div>
        <button id="restartBtn" class="restart-btn">PLAY AGAIN ↗</button>
      </div>
    </div>
  </main>
</body>
</html>
