<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rat Zap - Precision Tap Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <!-- Header / HUD -->
    <header class="game-header">
      <h1>🐀 RAT ZAP</h1>
      <div class="hud-stats">
        <span>Score: <strong id="score-val">0</strong></span>
        <span>Misses: <strong id="miss-val">0</strong></span>
      </div>
    </header>

    <!-- Main Game Arena -->
    <div id="game-arena">
      <div id="rat-target">
        <!-- Cute scalable vector rat icon (replace with img if you want) -->
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <ellipse cx="50" cy="55" rx="30" ry="20" fill="#a0a8b6"/>
          <circle cx="70" cy="45" r="15" fill="#a0a8b6"/>
          <circle cx="78" cy="40" r="8" fill="#ffb6c1"/>
          <circle cx="73" cy="43" r="3" fill="#222"/>
          <path d="M 20 60 Q 5 70 0 90" stroke="#ffb6c1" stroke-width="4" fill="none"/>
        </svg>
      </div>
    </div>

    <!-- Controls / Settings for Custom Audio -->
    <div class="game-controls">
      <label class="upload-btn">
        📂 Upload Funny Audio
        <input type="file" id="miss-audio-input" accept="audio/*" style="display: none;">
      </label>
      <button id="restart-btn">Restart Game</button>
    </div>
  </div>

  <!-- Hidden audio element for the miss sound -->
  <audio id="funny-miss-audio"></audio>

  <script src="game.js"></script>
</body>
</html>
