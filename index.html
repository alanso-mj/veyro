<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>VEYRO — Higher or Lower</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <header class="header">
            <h1>Higher or Lower</h1>
            <p>all about luck chud u aint passing 10 </p>
            <p>Guess what comes next.</p>
        </header>

        <section class="score-bar">
            <div>
                <span>Score</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>Best</span>
                <strong id="best">0</strong>
            </div>
        </section>

        <section class="card-area">

            <p class="label">CURRENT NUMBER</p>

            <div class="number-card">
                <span id="number">50</span>
            </div>

            <p id="result" class="result">
                Will the next number be higher or lower?
            </p>

        </section>

        <section class="buttons">

            <button id="higher" class="game-button higher">
                ↑ Higher
            </button>

            <button id="lower" class="game-button lower">
                ↓ Lower
            </button>

        </section>

        <button id="start" class="start-button">
            Start Game
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
